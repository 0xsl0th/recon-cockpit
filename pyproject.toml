[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-cockpit"
version = "0.1.0"
description = "Evidence-driven terminal reconnaissance for authorized lab targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.7,<15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
recon-cockpit = "recon_cockpit.cli:main"
recon-secure-agent = "recon_cockpit.secure_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: real Linux namespace and network enforcement (opt-in)",
]

[tool.setuptools.packages.find]
include = ["recon_cockpit*"]
